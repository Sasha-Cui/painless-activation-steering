### ─────────────────────────────── General ───────────────────────────────
seed: 1                 # torch / numpy seed
device: cuda             # cuda | cpu
output_dir: output_scale_up

### ────────────────────────────── HuggingFace ────────────────────────────
quantization: none        # 4bit | 8bit | none

### ─────────────────────────────── Model ────────────────────────────────
model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B


### ─────────────────────────────── Data  ────────────────────────────────
max_sample_size: 2000
n_train_proportion: 0.6
n_val_proportion:   0.2
n_test_proportion:  0.2

### ───────────────────────────── Benchmarks ─────────────────────────────
do_train: True
benchmarks:
    - DisabilityStatus
    - GenderIdentity
    - Nationality
    - PhysicalAppearance
    - RaceEthnicity
    - RaceXSES
    - Religion
    - SES
    - SexualOrientation
    - RaceXGender
    - TruthfulQA

### ─────────────────────────── Steering Search ──────────────────────────
layers_to_try:  [15]
steer_strengths: [1.0]
methods:
    - iBAS_wrong_only
    - iBAS_all
steer_target: residual
